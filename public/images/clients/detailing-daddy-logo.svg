<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%">
  <defs>
    <!-- Mascot Monkey Diamond Gradient -->
    <linearGradient id="ddOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="ddShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- 1. ORANGE DIAMOND WITH MASCOT -->
    <g transform="translate(75, 75)">
      <!-- Diamond (Rotated Square) -->
      <rect x="-65" y="-65" width="130" height="130" rx="14" transform="rotate(45)" fill="url(#ddOrangeGrad)" filter="url(#ddShadow)"/>
      
      <!-- Monkey Mascot Face -->
      <!-- Ears -->
      <circle cx="-38" cy="-2" r="14" fill="#000000"/>
      <circle cx="-38" cy="-2" r="8" fill="#FF8C2A"/>
      <circle cx="38" cy="-2" r="14" fill="#000000"/>
      <circle cx="38" cy="-2" r="8" fill="#FF8C2A"/>

      <!-- Head Base -->
      <ellipse cx="0" cy="5" rx="34" ry="32" fill="#000000"/>
      <ellipse cx="0" cy="10" rx="30" ry="24" fill="#FF9A3C"/>

      <!-- Fedora / Hat -->
      <path d="M -36 -12 C -28 -34, 28 -34, 36 -12 C 40 -10, 32 -6, 20 -8 C 0 -11, -20 -8, -36 -12 Z" fill="#1A1A1A"/>
      <path d="M -26 -16 C -20 -38, 20 -38, 26 -16 Z" fill="#0B0B0B"/>
      <!-- Hat Ribbon -->
      <path d="M -28 -14 C -10 -18, 10 -18, 28 -14 C 27 -11, -27 -11, -28 -14 Z" fill="#FF6A00"/>

      <!-- Sunglasses (with 'DD' Logo Inside) -->
      <path d="M -28 -6 Q -22 -14 -4 -12 L 0 -10 L 4 -12 Q 22 -14 28 -6 Q 30 8 16 9 Q 2 10 2 0 L -2 0 Q -2 10 -16 9 Q -30 8 -28 -6 Z" fill="#000000"/>
      <!-- Left Lens with 'D' -->
      <rect x="-22" y="-3" width="16" height="10" rx="3" fill="#FF9A3C"/>
      <text x="-19" y="6" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="10" fill="#000000">D</text>
      <!-- Right Lens with 'D' -->
      <rect x="6" y="-3" width="16" height="10" rx="3" fill="#FF9A3C"/>
      <text x="9" y="6" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="10" fill="#000000">D</text>

      <!-- Snout / Smile -->
      <path d="M -10 18 Q 0 24 10 18" stroke="#000000" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Chin detail -->
      <circle cx="-3" cy="14" r="1.5" fill="#000000"/>
      <circle cx="3" cy="14" r="1.5" fill="#000000"/>
    </g>

    <!-- 2. BRAND LOGOTYPE: "DETAILING DADDY" -->
    <!-- Custom stylized typography mimicking official bold condensed aesthetic -->
    <g transform="translate(170, 78)">
      <text x="0" y="0" 
            font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
            font-weight="900" 
            font-size="52" 
            letter-spacing="2.5px" 
            fill="#000000" 
            style="font-stretch: condensed; text-transform: uppercase;">
        DETAILING DADDY
      </text>
      <!-- Registered & Copyright Marks -->
      <text x="408" y="-22" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#000000">®©</text>
    </g>

    <!-- 3. SUBTITLE: "kompally | 9989930929" with Location Pin -->
    <g transform="translate(175, 122)">
      <!-- Location Pin Icon -->
      <path d="M 6 -12 C 0 -12, -4 -7, -4 -2 C -4 3, 6 12, 6 12 C 6 12, 16 3, 16 -2 C 16 -7, 12 -12, 6 -12 Z" fill="#000000"/>
      <circle cx="6" cy="-2" r="3.5" fill="#FF6A00"/>
      
      <!-- Branch and Phone Text -->
      <text x="26" y="2" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="22" letter-spacing="1.2px" fill="#000000">
        kompally <tspan font-weight="300" opacity="0.6">|</tspan> <tspan font-weight="700" letter-spacing="2px">9989930929</tspan>
      </text>
    </g>
  </g>
</svg>
