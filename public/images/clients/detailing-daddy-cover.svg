<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Studio Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D0C"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#120F0C"/>
    </linearGradient>

    <!-- Orange Brand Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Hexagon Honeycomb Lights Pattern -->
    <pattern id="hexGrid" width="160" height="92.38" patternUnits="userSpaceOnUse">
      <path d="M 40,0 L 80,0 L 120,23.09 L 120,69.28 L 80,92.38 L 40,92.38 L 0,69.28 L 0,23.09 Z" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="1.5" 
            opacity="0.12"/>
      <path d="M 120,23.09 L 160,0 L 160,92.38 L 120,69.28 Z" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="1.5" 
            opacity="0.08"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Hexagonal Honeycomb Ceiling Light Canopy -->
  <rect x="0" y="0" width="1200" height="420" fill="url(#hexGrid)"/>
  
  <!-- Subtle Amber Radial Studio Spotlight -->
  <circle cx="600" cy="380" r="450" fill="#FF7A00" opacity="0.06"/>

  <!-- Studio Wall Accent Stripes (Orange / Dark Charcoal from Real Workshop) -->
  <rect x="0" y="0" width="12" height="750" fill="#FF7A00"/>
  <rect x="1188" y="0" width="12" height="750" fill="#FF7A00"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

  <!-- Overhead Honeycomb Floating Light Fixture Vector Silhouette -->
  <g transform="translate(600, 160) scale(1.1)" filter="url(#hexGlow)">
    <!-- Center Hexagons -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
    <polygon points="-120,-70 -60,-35 -60,35 -120,70 -180,35 -180,-35" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
    <polygon points="120,-70 180,-35 180,35 120,70 60,35 60,-35" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
    <polygon points="-60,-140 0,-105 0,-35 -60,-70 -120,-35 -120,-105" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <polygon points="60,-140 120,-105 120,-35 60,-70 0,-35 0,-105" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Official Mascot & Diamond Logo Center Lockup -->
  <g transform="translate(600, 360)">
    <!-- Mascot Diamond -->
    <rect x="-55" y="-55" width="110" height="110" rx="12" transform="rotate(45)" fill="url(#orangeGrad)"/>
    
    <!-- Monkey Head -->
    <circle cx="-30" cy="-2" r="11" fill="#000000"/>
    <circle cx="30" cy="-2" r="11" fill="#000000"/>
    <ellipse cx="0" cy="5" rx="28" ry="26" fill="#000000"/>
    <ellipse cx="0" cy="8" rx="24" ry="20" fill="#FF9A3C"/>
    
    <!-- Fedora -->
    <path d="M -30 -10 C -22 -28, 22 -28, 30 -10 C 33 -8, 26 -5, 16 -7 C 0 -9, -16 -7, -30 -10 Z" fill="#1A1A1A"/>
    <path d="M -22 -14 C -16 -32, 16 -32, 22 -14 Z" fill="#000000"/>
    <path d="M -24 -12 C -8 -15, 8 -15, 24 -12" stroke="#FF6A00" stroke-width="2.5"/>
    
    <!-- Sunglasses DD -->
    <path d="M -22 -5 Q -17 -11 -3 -10 L 0 -8 L 3 -10 Q 17 -11 22 -5 Q 24 6 12 7 Q 2 8 2 0 L -2 0 Q -2 8 -12 7 Q -24 6 -22 -5 Z" fill="#000000"/>
    <rect x="-18" y="-3" width="12" height="8" rx="2" fill="#FF9A3C"/>
    <text x="-16" y="4" font-family="-apple-system, sans-serif" font-weight="900" font-size="8" fill="#000000">D</text>
    <rect x="6" y="-3" width="12" height="8" rx="2" fill="#FF9A3C"/>
    <text x="8" y="4" font-family="-apple-system, sans-serif" font-weight="900" font-size="8" fill="#000000">D</text>
    
    <!-- Smile -->
    <path d="M -8 14 Q 0 19 8 14" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Big Typography: DETAILING DADDY -->
  <text x="600" y="485" 
        text-anchor="middle" 
        font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
        font-weight="900" 
        font-size="64" 
        letter-spacing="5px" 
        fill="#FFFFFF">
    DETAILING DADDY<tspan font-size="24" dy="-26" font-family="sans-serif">®©</tspan>
  </text>

  <!-- Studio Badges and Spec Pills -->
  <g transform="translate(600, 565)" text-anchor="middle">
    <!-- Subtitle: Car Protection Studio • Kompally -->
    <text y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="4px" fill="#FF7A00">
      CAR PROTECTION STUDIO • KOMPALLY BRANCH
    </text>

    <!-- Real Client Vehicle Reference Badge -->
    <g transform="translate(0, 36)">
      <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#1A1816" stroke="#FF7A00" stroke-width="1.2"/>
      <text y="5" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" letter-spacing="1.5px" fill="#FAF3DF">
        ✦ MAHINDRA XUV700 [TG 10 BA 5186] • 9H CERAMIC &amp; PPF
      </text>
    </g>

    <!-- Location & Contact -->
    <text y="105" font-family="'Inter', sans-serif" font-weight="500" font-size="14" letter-spacing="2px" fill="#888888">
      📍 Kompally, Hyderabad | 📞 9989930929
    </text>
  </g>
</svg>
